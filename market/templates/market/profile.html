<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Profile · Freshie CoinTracker</title>
<style>body{margin:0;background:#0a0a0a;color:#f0f0f0;font:15px Inter,Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.card{width:min(520px,calc(100% - 36px));background:#181818;border:1px solid #393326;border-radius:16px;padding:28px;box-sizing:border-box}h1{margin:0 0 8px;color:#f5c518}p{color:#aaa;margin:0 0 22px}.field{display:block;margin:16px 0 6px;color:#ddd}input,select{width:100%;padding:12px;border-radius:8px;border:1px solid #444;background:#101010;color:#fff;box-sizing:border-box}button,a{display:inline-block;margin-top:20px;padding:11px 16px;border:0;border-radius:8px;background:#f5c518;color:#111;font-weight:700;text-decoration:none;cursor:pointer}.secondary{background:#292929;color:#fff;margin-left:8px}#status{margin-top:16px;color:#f5c518;min-height:22px}</style></head>
<body><main class="card"><h1>My Profile</h1><p>Manage the personal details associated with your CryptoTracker account.</p>
<form id="profileForm"><label class="field" for="first_name">First name</label><input id="first_name" maxlength="150" autocomplete="given-name" required>
<label class="field" for="surname">Surname</label><input id="surname" maxlength="150" autocomplete="family-name" required>
<label class="field" for="phone_number">Phone number</label><input id="phone_number" maxlength="30" type="tel" autocomplete="tel" placeholder="e.g. +234...">
<label class="field" for="gender">Gender</label><select id="gender"><option value="">Select gender</option><option value="male">Male</option><option value="female">Female</option><option value="other">Other</option><option value="prefer_not_to_say">Prefer not to say</option></select>
<button type="submit">Save profile</button><a class="secondary" href="/">Back to dashboard</a></form><div id="status" role="status"></div></main>
<script>
const token=localStorage.getItem('crypto_token');const statusEl=document.getElementById('status');
if(!token){statusEl.textContent='Please sign in from the dashboard first.';document.getElementById('profileForm').querySelector('button').disabled=true;}
async function api(path,options={}){const response=await fetch(path,{...options,headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json',...(options.headers||{})}});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.detail||'Request failed');return data;}
(async()=>{if(!token)return;try{const data=await api('/api/profile');for(const key of ['first_name','surname','phone_number','gender'])document.getElementById(key).value=data[key]||'';}catch(error){statusEl.textContent=error.message;}})();
document.getElementById('profileForm').addEventListener('submit',async event=>{event.preventDefault();statusEl.textContent='Saving...';const payload={first_name:document.getElementById('first_name').value.trim(),surname:document.getElementById('surname').value.trim(),phone_number:document.getElementById('phone_number').value.trim(),gender:document.getElementById('gender').value};try{const data=await api('/api/profile',{method:'PUT',body:JSON.stringify(payload)});statusEl.textContent=data.message||'Profile saved.';}catch(error){statusEl.textContent=error.message;}});
</script></body></html>
